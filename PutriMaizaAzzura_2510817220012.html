<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPhotography</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body{
            background:white;
            font-family: Georgia, serif;
        }
        .navbar-custom{
            background:#ececec;
            padding:15px 0;
            border-bottom:1px solid #ddd;
        }
        .navbar-brand{
            font-weight:bold;
            font-size:28px;
        }
        .nav-link{
            font-size:12px;
            letter-spacing:2px;
            margin-left:20px;
            color:#555 !important;
            padding:8px 15px !important;
            transition:.3s;
        }       
        .nav-link:hover{
            color:black !important;
        }
        .nav-link.active{
            border:2px solid #dcdcdc;
            border-radius:12px;
            background:white;
            color:black !important;
            font-weight:600;
        }
        .hero{
            padding-top:50px;
            text-align:center;
        }
        .hero h2{
            font-size:34px;
            font-weight:bold;
            margin-bottom:15px;
        }
        .hero h4{
            font-size:22px;
            font-weight:bold;
            margin-bottom:20px;
        }
        .hero p{
            font-size:12px;
            color:gray;
            letter-spacing:3px;
            text-transform:uppercase;
        }
        .filter-btns{
            margin-top:50px;
            margin-bottom:40px;
        }
        .filter-btns .btn{
            border-radius:30px;
            margin:0 5px;
            font-size:12px;
            padding:8px 18px;
        }
        .gallery img{
            width:100%;
            height:220px;
            object-fit:cover;
            transition:0.4s;
        }
        .gallery img:hover{
            transform:scale(1.05);
        }
        footer{
            text-align:center;
            padding:90px 0 50px;
        }
        footer h3{
            font-weight:bold;
            margin-bottom:10px;
        }
        footer p{
            color:gray;
            font-size:13px;
        }
        .social-icons i{
            margin:0 8px;
            color:#666;
            font-size:18px;
            transition:.3s;
        }
        .social-icons i:hover{
            color:black;
        }
        @media (max-width:768px){
            .hero h2{
                font-size:28px;
            }
            .hero h4{
                font-size:18px;
            }
            .nav-link{
                margin-left:0;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom shadow-sm sticky-top">
        <div class="container-fluid px-5">
            <a class="navbar-brand" href="#">
                JPhotography
            </a>
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            HOME
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            ABOUT ME
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            PORTFOLIO
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            CONTACT
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <section class="hero">
            <h2>
                Hi. Hello.. I Am JohnDas..!
            </h2>
            <h4>
                I Travel Around The World To Get The Best Photos.!
            </h4>
            <p>
                AWARD WINNING PHOTOGRAPHER /
                CINEMATOGRAPHER /
                WRITER
            </p>
        </section>
        <div class="text-center filter-btns">
            <button class="btn btn-dark">
                All
            </button>
            <button class="btn btn-outline-secondary">
                Landscape
            </button>
            <button class="btn btn-outline-secondary">
                Portrait
            </button>
            <button class="btn btn-outline-secondary">
                Product
            </button>
        </div>
        <div class="row g-3 gallery">
            <div class="col-md-3">
                <img src="foto1.jpeg" class="img-fluid rounded">
            </div>
            <div class="col-md-3">
                <img src="foto2.jpeg" class="img-fluid rounded">
            </div>
            <div class="col-md-3">
                <img src="foto3.jpeg" class="img-fluid rounded">
            </div>
            <div class="col-md-3">
                <img src="foto4.jpeg" class="img-fluid rounded">
            </div>
            <div class="col-md-3">
                <img src="foto5.jpeg" class="img-fluid rounded">
            </div>
            <div class="col-md-3">
                <img src="foto6.jpeg" class="img-fluid rounded">
            </div>
            <div class="col-md-3">
                <img src="foto7.jpeg" class="img-fluid rounded">
            </div>
            <div class="col-md-3">
                <img src="foto8.jpeg" class="img-fluid rounded">
            </div>
            <div class="col-md-3">
                <img src="foto9.jpeg" class="img-fluid rounded">
            </div>
            <div class="col-md-3">
                <img src="foto10.jpeg" class="img-fluid rounded">
            </div>
            <div class="col-md-3">
                <img src="foto11.jpeg" class="img-fluid rounded">
            </div>
            <div class="col-md-3">
                <img src="foto12.jpeg" class="img-fluid rounded">
            </div>
        </div>
        <footer>
            <h3>JPhotography</h3>
            <p>
                © Copyright 2019 All Rights Reserved
            </p>
            <div class="social-icons">
                <i class="bi bi-dribbble"></i>
                <i class="bi bi-behance"></i>
                <i class="bi bi-instagram"></i>
                <i class="bi bi-pinterest"></i>
                <i class="bi bi-facebook"></i>
                <i class="bi bi-twitter"></i>
            </div>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
